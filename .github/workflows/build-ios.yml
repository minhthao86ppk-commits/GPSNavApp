name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cai dat Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync ios

      - name: Bien dich Xcode
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Dong goi thanh IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r GPSNavApp.ipa Payload
          rm -rf Payload

      - name: Xuat file IPA
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Nav-App-IPA
          path: GPSNavApp.ipa
